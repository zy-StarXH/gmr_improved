analysis:
  metrics:
    - name: joint_jump
      frame_flag: joint_jump_flag
      summary_rate: joint_jump_rate
      event_type: JOINT_JUMP
      excluded_leading_frames_from_rate: 1
    - name: velocity_violation
      frame_flag: velocity_violation_flag
      summary_rate: velocity_violation_frame_rate
      event_type: VELOCITY_LIMIT_EXCEEDED
      excluded_leading_frames_from_rate: 1
    - name: near_limit_2pct
      frame_flag: near_limit_2pct_flag
      summary_rate: near_limit_2pct_frame_rate
      event_type: NEAR_JOINT_LIMIT_2PCT
      excluded_leading_frames_from_rate: 0
    - name: self_collision_nonhand
      frame_flag: self_collision_nonhand_flag
      summary_rate: self_collision_nonhand_frame_rate
      event_type: SELF_COLLISION_NONHAND
      excluded_leading_frames_from_rate: 0
    - name: ground_penetration
      frame_flag: penetration_flag
      summary_rate: ground_penetration_frame_rate
      event_type: GROUND_PENETRATION
      excluded_leading_frames_from_rate: 0
    - name: severe_ground_penetration
      frame_flag: severe_penetration_flag
      event_type: null
      excluded_leading_frames_from_rate: 0
    - name: undesired_ground_contact
      frame_flag: undesired_ground_contact_flag
      summary_rate: undesired_ground_contact_frame_rate
      event_type: UNDESIRED_GROUND_CONTACT
      excluded_leading_frames_from_rate: 0
    - name: foot_slide
      frame_flag_any:
        - left_foot_slide_flag
        - right_foot_slide_flag
      summary_rate: foot_slide_frame_rate
      event_type: FOOT_SLIDE
      excluded_leading_frames_from_rate: 0
  window_padding_s: 1.0
  pose_frames_per_window: 5
  case_counts:
    self_collision_nonhand: 4
    ground_penetration: 3
    joint_jump: 3
  controls:
