reviews:
  - case_id: C01
    visible_artifact: partial
    metric_agreement: agree
    notes: >-
      舞蹈姿态在事件附近发生明显上肢构型切换；left_shoulder_yaw_link 与 torso_link
      的非手部碰撞深度达到 0.0992 m，同时窗口最大关节 step/速度为
      1.153 rad/34.58 rad/s。点线骨架不显示 mesh 体积，不能直接观察完整穿插，
      但该 pair 的运动学树距离为 3，不属于本分析标记的近相邻结构重叠。
  - case_id: C02
    visible_artifact: partial
    metric_agreement: partial
    notes: >-
      摔倒起身动作在窗口中合理进入贴地和蜷缩阶段，但左右下肢明显交叠；
      left_hip_yaw_link 与 right_knee_link 的深度为 0.0976 m，窗口还出现
      0.0911 m 地面穿透。floor-motion 语义解释接触姿态，却不能证明该几何穿插合理。
  - case_id: C03
    visible_artifact: confirmed
    metric_agreement: agree
    notes: >-
      multiple-actions 轨迹从站立快速进入折叠贴地姿态，左臂与左髋区域重叠；
      left_elbow_link 与 left_hip_roll_link 的碰撞深度为 0.0820 m，并伴随
      约 0.0850 m 穿地和关节长期贴限，指标与可见拥挤姿态同向。
  - case_id: C04
    visible_artifact: confirmed
    metric_agreement: agree
    notes: >-
      标记为 walking 的窗口持续呈现极度蜷缩和肢体拥挤，而不是常规步行姿态；
      left_elbow_link 与 left_hip_yaw_link 的事件持续 2.83 s、深度 0.0775 m，
      窗口同时有 0.1308 m 穿地和全程贴近关节限位，属于优先修复案例。
  - case_id: C05
    visible_artifact: confirmed
    metric_agreement: partial
    notes: >-
      push-and-fall 动作合理包含倒地过程，但事件段多处身体位于地面以下；最大穿透
